    <!-- FAQ Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "How much does mixing and mastering cost at Tornado Audio?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Standard rates are $120 per song for mastering only, $250 per song for a mix, and $350 per song for mix and master together. Introductory rates of $75, $125 and $175 are currently available for a limited number of projects, in exchange for portfolio use and a testimonial. Albums and EPs of four or more songs receive 15% off."
          }
        },
        {
          "@type": "Question",
          "name": "How long does it take to mix a song?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Mastering is returned within 3 business days, a mix within 5 business days, and mix and master together within 7 business days. Rush slots are available at 1.5x the standard rate when you need it sooner."
          }
        },
        {
          "@type": "Question",
          "name": "Where is Tornado Audio based?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Tornado Audio is based in Bloomington-Normal, Illinois. Mixing and mastering are handled remotely for artists anywhere. Live sound engineering is available throughout Central Illinois and the Chicago area."
          }
        },
        {
          "@type": "Question",
          "name": "How many revisions are included?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Master Only and Mix each include 2 revision rounds, and Mix + Master includes 3. Additional revisions beyond those rounds are billed hourly."
          }
        },
        {
          "@type": "Question",
          "name": "Can I hear a mix of my own song before booking?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. A 60-second excerpt of your track will be mixed at no cost so you can judge the work on your own material. One free sample per customer, delivered at preview quality for evaluation."
          }
        },
        {
          "@type": "Question",
          "name": "What music genres does Hunter Johanson specialize in?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Rock is the primary specialization, with particular focus on heavy guitar tones, drum processing and dynamic mix arrangements. Country, pop, indie and acoustic projects are regularly taken on as well."
          }
        },
        {
          "@type": "Question",
          "name": "What file formats should I send?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Individual track stems in WAV format at the highest sample rate and bit depth from your session give the best results. AIFF and MP3 are accepted, as are most DAW project files. Files can be sent via Dropbox, WeTransfer or Google Drive."
          }
        },
        {
          "@type": "Question",
          "name": "How does payment work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A 50% deposit reserves your slot, with the balance due before final files are delivered. Payment is accepted via Zelle, Venmo or bank transfer."
          }
        }
      ]
    }
